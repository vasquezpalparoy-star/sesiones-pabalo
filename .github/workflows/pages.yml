name: Publicar AulaFácil IA en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: https://intsmwiivbdaversvlky.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rAR4xuqnyM8w3zXy3Z1qdQ_-SBglNl-
      - name: Verificar compilación antes de publicar
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/sesiones-pabalo/assets/' dist/index.html
          if grep -q 'src="/src/main.js"' dist/index.html; then
            echo "ERROR: HTML original sin compilar"; exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
