<head>
<meta charset="UTF-8"/>

<title>Sesiones Grafiplot</title>
<style>body{margin:0;background:#f1f7f9;font-family:system-ui,sans-serif;color:#193d47}#loading{margin:14vh auto;max-width:540px;padding:30px;border-radius:20px;background:white;box-shadow:0 10px 30px #18425314;text-align:center}#loading strong{color:#087f75;font-size:25px}#loading p{line-height:1.6}#loading a{color:#067e7c}</style>
</head>
<body>
<div id="app"><div id="loading"><strong>Sesiones Grafiplot</strong><p>Cargando aplicación docente…</p><p>Si esta pantalla no cambia, abre la <a href="https://github.com/vasquezpalparoy-star/sesiones-pabalo/actions">publicación de GitHub Actions</a> y comprueba que está en verde.</p></div></div>
<script>window.addEventListener('error',function(e){const el=document.getElementById('loading');if(el){el.innerHTML='<strong>No se pudo cargar la aplicación</strong><p>Comprueba que GitHub Pages usa GitHub Actions y que la compilación terminó correctamente.</p>';}});window.addEventListener('unhandledrejection',function(){const el=document.getElementById('loading');if(el){el.innerHTML='<strong>Error al iniciar AulaFácil IA</strong><p>Revisa la configuración de la publicación y Supabase.</p>';}});</script>
<script type="module" src="/src/main.js"></script>
</body></html>
